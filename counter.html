<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="counter.js" defer></script>
    <link rel="stylesheet" href="counter.css">
    <title>Digital counter</title>
</head>
<body>
    <div class="main">
        <div class="heading">
            <h2 id="hd">Smart digital counter</h2>

        </div>
    </div>
</body>
</html>
